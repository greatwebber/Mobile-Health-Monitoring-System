<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#075f5b">
        <title>Offline · EdeHealth Sentinel</title>
        <style>
            :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f3faf8; }
            * { box-sizing: border-box; }
            body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 80% 10%, #ccfbf1, transparent 22rem), #f3faf8; }
            main { width: min(100%, 30rem); padding: 2rem; border: 1px solid #ccfbf1; border-radius: 1.75rem; background: rgba(255,255,255,.94); box-shadow: 0 24px 70px rgba(6,78,59,.12); text-align: center; }
            .mark { width: 4rem; height: 4rem; margin: 0 auto 1.5rem; display: grid; place-items: center; border-radius: 1.25rem; color: white; background: #075f5b; font-size: 1.75rem; font-weight: 900; }
            h1 { margin: 0; font-size: 1.8rem; letter-spacing: -.03em; }
            p { margin: 1rem auto 0; color: #475569; line-height: 1.7; }
            button { margin-top: 1.5rem; min-height: 3rem; padding: .75rem 1.25rem; border: 0; border-radius: .8rem; color: white; background: #0f766e; font: inherit; font-weight: 750; cursor: pointer; }
            small { display: block; margin-top: 1.25rem; color: #64748b; line-height: 1.5; }
        </style>
    </head>
    <body>
        <main>
            <div class="mark" aria-hidden="true">S</div>
            <h1>You’re currently offline</h1>
            <p>EdeHealth Sentinel cannot load current clinical information without a connection. Reconnect before completing any important health action.</p>
            <button type="button" onclick="window.location.reload()">Try again</button>
            <small>For urgent medical help, contact the Medical Centre or an appropriate emergency service directly.</small>
        </main>
    </body>
</html>
